<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{/homeLayout :: Layout(~{::section})}">
<head>
</head>
<body>
    <section>
        <div class="container mt-5 mb-5">
            <h2 class="mb-4"><i class="bi bi-box-seam"></i> Manage Incoming Orders</h2>
            
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Order Info</th>
                                    <th>Product</th>
                                    <th>Buyer Details</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody">
                                <!-- Loaded dynamically via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                loadSales();
            });

            function loadSales() {
                fetch('/seller/api/my-sales')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('salesTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4">No orders received yet.</td></tr>`;
                        return;
                    }

                    data.forEach(item => {
                        const dateObj = new Date(item.orderDate);
                        const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                        const statusBadge = getStatusBadge(item.status);

                        const row = `
                            <tr>
                                <td>
                                    <small class="text-muted">ID: ${item.orderIdDisplay}</small><br>
                                    <small>${dateStr}</small>
                                </td>
                                <td>
                                    <strong>${item.productName}</strong><br>
                                    Quantity: ${item.quantity} Lots<br>
                                    Total: ₹${item.totalPrice.toFixed(2)}
                                </td>
                                <td>
                                    <strong>${item.buyerName}</strong><br>
                                    <small>${item.buyerEmail}</small><br>
                                    <small>${item.buyerPhone}</small><br>
                                    <small class="text-muted">${item.shippingAddress}</small>
                                </td>
                                <td>
                                    ${statusBadge}
                                </td>
                                <td>
                                    <div class="dropdown">
                                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                            Update
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item" href="#" onclick="updateStatus(${item.itemId}, 'Pending')">Pending</a></li>
                                            <li><a class="dropdown-item" href="#" onclick="updateStatus(${item.itemId}, 'Confirmed')">Confirmed</a></li>
                                            <li><a class="dropdown-item" href="#" onclick="updateStatus(${item.itemId}, 'Shipped')">Shipped</a></li>
                                            <li><a class="dropdown-item" href="#" onclick="updateStatus(${item.itemId}, 'Delivered')">Delivered</a></li>
                                            <li><hr class="dropdown-divider"></li>
                                            <li><a class="dropdown-item text-danger" href="#" onclick="updateStatus(${item.itemId}, 'Cancelled')">Cancel</a></li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => console.error("Error loading sales:", err));
            }

            function getStatusBadge(status) {
                let color = 'secondary';
                if (status === 'Confirmed') color = 'info';
                if (status === 'Shipped') color = 'primary';
                if (status === 'Delivered') color = 'success';
                if (status === 'Cancelled') color = 'danger';
                return `<span class="badge bg-${color}">${status || 'Pending'}</span>`;
            }

            function updateStatus(itemId, newStatus) {
                if(!confirm(`Are you sure you want to mark this order as ${newStatus}?`)) return;

                fetch('/seller/api/update-status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                    },
                    body: JSON.stringify({ itemId: itemId, status: newStatus })
                })
                .then(response => {
                    if (response.ok) {
                        // Reload data to reflect changes
                        loadSales();
                    } else {
                        alert("Failed to update status.");
                    }
                })
                .catch(err => console.error(err));
            }
        </script>
    </section>
</body>
</html>
